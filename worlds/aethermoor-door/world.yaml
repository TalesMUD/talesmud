# Aethermoor Door world pack.
# Gameplay shape follows a daily town-hub RPG. Names, prose, and layout are original Veilspan.
id: aethermoor-door
title: Aethermoor Door
setting: Veilspan
town: Ashmarket Square
forest: The Bramblewood
healer: Sister Callewyn
bank: Ashmarket Vault
banker: Ilen Vos
inn: The Emberloft
innkeeper: Maela Quinn
armory: Soot and Steel
smith: Harl Quill
heal_cost: 20
daily_fights: 15
intro:
  - "Soot-warm cobbles, a well that smells of rain on iron, and the Bramblewood"
  - "gate standing open. Each day allows a fixed number of walks into the trees."
  - "Spend them. The vault keeps whatever you do not carry on your belt."
news:
  - "Ash-wind is up. The Bramblewood paths are open until dusk."
  - "Sister Callewyn is mending ribs for coin, not for gossip."
  - "Ilen Vos locked the vault early yesterday. He is open again."
  - "No one has seen the Ashwyrm above the cinder ridge. The ridge can wait."
