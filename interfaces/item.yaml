# =============================================================================
# Item Interface
# =============================================================================
#
# Items represent anything a player can pick up, equip, use, or trade.
# This includes weapons, armor, consumables, quest items, currency, and
# crafting materials.
#
# TEMPLATE SYSTEM (same pattern as NPCs):
# ────────────────────────────────────────
# Items use the same template/instance pattern as NPCs:
#
#   1. TEMPLATE (isTemplate: true)
#      A blueprint definition. Not a physical item in the world — used to
#      create instances when items are spawned, looted, or bought.
#      All items in merchant inventories, loot tables, and starting gear
#      reference templates by their ID.
#
#   2. INSTANCE (isTemplate: false, templateId: "<uuid>")
#      A physical item in the world, spawned from a template. Lives in a
#      player's inventory, equipped slot, room floor, or container.
#      Created automatically when a template is instantiated.
#
# When authoring content, you always create TEMPLATES. The game engine
# creates instances from templates at runtime.
#
# CONTAINER SYSTEM:
# ─────────────────
# Items with maxItems > 0 are containers (chests, bags, crates). They can
# hold other items inside them. Containers can be locked (locked: true)
# and require a specific key item (lockedBy: "<item_id>") to open.
#
# =============================================================================

name: ItemDTO
endpoint: /api/items

fields:
  # ─── Identity ───────────────────────────────────────────────────────────────

  id:
    type: string
    # Auto-generated UUID. Do not set manually on creation.
    # Convention for authored content: use prefixed IDs like "ITM0001".

  name:
    type: string
    required: true
    # Display name shown in inventory, loot, and room descriptions.
    # Examples: "Rusty Sword", "Health Potion", "Iron Ore"

  description:
    type: string
    # Short description shown when a player examines the item.
    # 1-2 sentences. Example: "A weathered blade with notches along the edge."

  detail:
    type: string
    # Extended inspection text, shown on closer examination.
    # Use for lore, hidden clues, or flavor text.

  # ─── Template System ────────────────────────────────────────────────────────

  isTemplate:
    type: boolean
    default: false
    # If true, this is a blueprint for creating item instances.
    # Templates are referenced by loot tables, merchants, and starting gear.
    # If false, this is a physical item instance in the world.

  templateId:
    type: string
    # For instances: points back to the source template's ID.
    # Empty for templates. Do not set manually — the engine fills this in.

  instanceSuffix:
    type: string
    # For instances: unique identifier suffix. Do not set manually.

  # ─── Classification ─────────────────────────────────────────────────────────

  type:
    type: string
    required: true
    enum: [currency, consumable, armor, weapon, collectible, quest, crafting_material]
    # Primary item category. Determines core behavior:
    #   currency          — gold or other monetary items (auto-stacks)
    #   consumable        — can be used/consumed (potions, food, scrolls)
    #   armor             — equippable in armor slots (head, chest, legs, etc.)
    #   weapon            — equippable in hand slots (main_hand, off_hand)
    #   collectible       — no mechanical use, trophy/decoration items
    #   quest             — required for quest objectives, usually noPickup: false
    #   crafting_material — components for crafting recipes

  subType:
    type: string
    # Weapon/armor sub-classification. Freeform but should follow conventions.
    # Affects combat animations and proficiency checks.
    examples: [sword, twohandsword, axe, spear, shield, bow, staff, dagger, mace, crossbow]

  slot:
    type: string
    enum: [inventory, container, purse, head, chest, legs, boots, neck, ring1, ring2, hands, main_hand, off_hand]
    default: inventory
    # Equipment slot this item occupies when equipped. Items that can't be
    # equipped stay as "inventory". Slot meanings:
    #   inventory  — stays in inventory (default, non-equippable)
    #   container  — lives inside another item (container system)
    #   purse      — currency storage
    #   head       — helmet, hat, crown
    #   chest      — body armor, robes, shirt
    #   legs       — leggings, pants, greaves
    #   boots      — footwear
    #   neck       — necklace, amulet
    #   ring1/ring2 — finger rings (two ring slots available)
    #   hands      — gloves, gauntlets, bracers
    #   main_hand  — primary weapon
    #   off_hand   — shield, secondary weapon, or offhand item

  quality:
    type: string
    enum: [normal, magic, rare, legendary, mythic]
    default: normal
    # Item rarity tier. Affects name color in UI and perceived value:
    #   normal    — common, white text
    #   magic     — uncommon, green text
    #   rare      — rare, blue text
    #   legendary — very rare, purple text
    #   mythic    — unique/one-of-a-kind, orange text

  level:
    type: integer
    default: 0
    # Minimum player level required to equip or use this item.
    # 0 = no level requirement.

  # ─── Economy ────────────────────────────────────────────────────────────────

  basePrice:
    type: integer
    default: 0
    # Base gold value. Used for merchant buy/sell calculations.
    # Actual price = basePrice * merchant multiplier.
    # 0 = cannot be sold (or priceless).

  stackable:
    type: boolean
    default: false
    # If true, multiple copies stack into one inventory slot.
    # Useful for consumables, currency, and crafting materials.

  quantity:
    type: integer
    default: 1
    # Current stack count for stackable items. Only meaningful if
    # stackable: true. For non-stackable items, always 1.

  maxStack:
    type: integer
    default: 0
    # Maximum stack size. 0 = unlimited stacking (for stackable items).
    # Example: maxStack: 20 means up to 20 potions in one slot.

  # ─── Usage ──────────────────────────────────────────────────────────────────

  consumable:
    type: boolean
    default: false
    # If true, the item is destroyed/consumed when used.
    # Typically paired with onUseScriptId to define the effect.

  onUseScriptId:
    type: string
    # Script ID executed when a player uses this item.
    # The script receives the player and item as context.
    # Use for potions (heal), scrolls (cast spell), keys (unlock), etc.
    # See script.yaml for script definitions.

  noPickup:
    type: boolean
    default: false
    # If true, players cannot pick up this item from the ground.
    # Use for permanent room decorations or scenery items that should
    # be visible but not collectable (e.g., "mounted sword on wall").

  # ─── Combat Attributes ──────────────────────────────────────────────────────

  attributes:
    type: object
    # Combat and stat bonuses provided when this item is equipped.
    # Keys are stat names, values are numeric bonuses.
    # These are applied to the character's stats while the item is equipped.
    examples:
      damage: 10
      defense: 5
      armor: 15
      critChance: 0.05
      strength: 3
      dexterity: 2
      range: 1.5

  # ─── Custom Properties ──────────────────────────────────────────────────────

  properties:
    type: object
    # Freeform key-value properties for scripts, quests, and custom logic.
    # Not interpreted by the core engine — used by Lua scripts and custom code.
    # Examples: { "poisonDamage": 5, "elementalType": "fire", "questFlag": "key_found" }

  tags:
    type: string[]
    # Freeform tags for filtering, merchant restrictions, and quest tracking.
    # Examples: ["cursed", "stolen", "soulbound", "fire_element", "crafted"]

  # ─── Container Properties ───────────────────────────────────────────────────
  # These fields only apply to container items (chests, bags, crates).
  # For non-container items, leave these at defaults.

  maxItems:
    type: integer
    default: 0
    # Container capacity (number of items it can hold).
    # 0 = not a container. Any value > 0 makes this item a container.

  closed:
    type: boolean
    default: false
    # Whether the container is currently closed. Closed containers
    # must be opened before items can be accessed.

  locked:
    type: boolean
    default: false
    # Whether the container is locked. Locked containers require the
    # key item specified in lockedBy to open.

  lockedBy:
    type: string
    # Item ID of the key required to unlock this container.
    # The player must have this item in their inventory to unlock.

  # ─── Client Metadata ────────────────────────────────────────────────────────

  meta:
    type: object
    # Optional metadata for client-side presentation.
    properties:
      img:
        type: string
        # Image/icon identifier for the item in the client UI.
        # References an asset in the client's image library.

  # ─── Timestamps ─────────────────────────────────────────────────────────────

  created:
    type: datetime
    # Auto-set on creation.

  createdBy:
    type: string
    # User ID of the creator (for user-created content).
