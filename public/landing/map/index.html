<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Veilspan World Map</title>
  <meta name="description" content="Explore the public world map of Veilspan — charted zones, roads, and discoveries in Chapter I." />
  <base href="/map/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Fira+Code:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/map/map.css?v=map20" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div id="app">
    <nav class="nav" id="nav">
      <a class="nav-brand" href="/"><span>&gt;</span> talesmud.veilspan</a>
      <ul class="nav-links">
        <li><a href="/#lore">Lore</a></li>
        <li><a href="/play">Play</a></li>
        <li><a href="/map/?v=map20" class="active" aria-current="page">Map</a></li>
        <li><a href="/docs/">Docs</a></li>
      </ul>
    </nav>

    <header class="map-chrome">
      <div class="map-titles">
        <h1>Veilspan</h1>
        <div class="chapter" id="chapter-label">World Map</div>
      </div>
      <div class="hud-controls" role="toolbar" aria-label="Map controls">
        <button type="button" class="chip hidden" id="btn-back" aria-hidden="true" title="Return to continent">← Continent</button>
        <button type="button" class="chip active lod-only" data-lod="auto" title="Auto LOD by zoom">Auto</button>
        <button type="button" class="chip lod-only" data-lod="continent" title="Continent overview">Lands</button>
        <button type="button" class="chip lod-only" data-lod="zones" title="Zones &amp; roads">Zones</button>
        <button type="button" class="chip lod-only" data-lod="pois" title="Settlements">Towns</button>
        <span class="chip-sep" aria-hidden="true"></span>
        <button type="button" class="chip" id="btn-zoom-in" title="Zoom in">+</button>
        <button type="button" class="chip" id="btn-zoom-out" title="Zoom out">−</button>
        <button type="button" class="chip" id="btn-reset" title="Reset view">Reset</button>
      </div>
    </header>

    <div class="map-stage">
      <div id="map-viewport" aria-label="Interactive world map">
        <svg id="map-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Veilspan world map">
          <defs>
            <filter id="fogHatch">
              <feColorMatrix type="saturate" values="0.45"/>
            </filter>
            <filter id="zonePop" color-interpolation-filters="sRGB">
              <feColorMatrix type="matrix" values="1.22 0.04 0.02 0 0.06  0.03 1.18 0.03 0 0.05  0.01 0.04 1.08 0 0.02  0 0 0 1 0"/>
            </filter>
            <radialGradient id="cursorGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fff8e4" stop-opacity="0.55"/>
              <stop offset="30%" stop-color="#f6d9a0" stop-opacity="0.22"/>
              <stop offset="65%" stop-color="#e8c878" stop-opacity="0.05"/>
              <stop offset="100%" stop-color="#e8c878" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="hoverMaskGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
              <stop offset="45%" stop-color="#fff" stop-opacity="0.7"/>
              <stop offset="75%" stop-color="#fff" stop-opacity="0.22"/>
              <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
            <mask id="hoverMask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="2048" height="2048">
              <ellipse id="hoverMaskEllipse" cx="0" cy="0" rx="1" ry="1" fill="url(#hoverMaskGrad)"/>
            </mask>
          </defs>
          <g id="camera">
            <g id="continent-root">
              <rect id="parchment" x="0" y="0" width="2048" height="2048" fill="#0a0e14" rx="4"/>
              <image id="world-plate" href="/map/assets/world/world-plate.jpg?v=map20" width="2048" height="2048" opacity="1" preserveAspectRatio="xMidYMid meet" />
              <g id="layer-fog"></g>
              <g id="layer-sat" mask="url(#hoverMask)" filter="url(#zonePop)" opacity="0" pointer-events="none">
                <image href="/map/assets/world/world-plate.jpg?v=map20" width="2048" height="2048" preserveAspectRatio="xMidYMid meet"/>
              </g>
              <g id="layer-highlight" pointer-events="none">
                <ellipse id="hover-light" fill="url(#cursorGlow)" rx="180" ry="180" cx="0" cy="0"/>
              </g>
              <g id="layer-zones"></g>
              <g id="layer-chips"></g>
              <g id="layer-cities"></g>
            </g>
            <g id="zone-root" class="hidden">
              <image id="zone-plate" href="" width="1024" height="1024" preserveAspectRatio="xMidYMid meet" />
              <g id="zone-pois"></g>
            </g>
          </g>
        </svg>

        <div class="legend">
          <span><i class="swatch live"></i> Charted</span>
          <span><i class="swatch fog"></i> Uncharted</span>
        </div>
        <div class="hint">Click a town or zone for lore · Double-click to enter · Drag to pan</div>
      </div>

      <aside id="detail-panel" aria-live="polite" aria-hidden="true">
        <button type="button" class="panel-close" id="panel-close" aria-label="Close">×</button>
        <div class="panel-header">
          <div class="eyebrow" id="panel-eyebrow">Zone</div>
          <h2 id="panel-title">—</h2>
          <div class="meta" id="panel-meta"></div>
        </div>
        <div class="panel-body" id="panel-body"></div>
      </aside>
    </div>
  </div>
  <script src="/map/map.js?v=map20"></script>
</body>
</html>
