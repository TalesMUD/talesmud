# Ruleset profile. Defaults match current play.
# Do not copy keys from config/combat_balance.yaml into this file.
# level_gap, threat, reward_scale, class_balance, difficulty multipliers,
# and named overrides stay in that file. Base XP listed here is multiplied
# by reward_scale afterward.

progression:
  level_cap: 50
  level_up_mode: auto   # auto | trainer
  # xp_required:        # cumulative XP to reach that level; omit = built-in curve
  #   1: 0
  #   2: 40
  # base_xp_by_enemy_level:  # used only when an enemy's xp reward is 0
  #   1: 20

death:
  xp_loss_percent: 10
  gold_loss_flat: 1
  gold_loss_percent: 0
  respawn: bindpoint    # bindpoint | next_reset
  respawn_hp_percent: 50
  damage_armor: true

new_day:
  full_heal: false
  timezone: UTC

resources: {}

combat:
  pacing: auto          # auto | turn_based
  safe_room: stay       # stay | bind | start — used only when disconnect is release
  disconnect: continue  # continue | release — continue leaves the fight running
  bare_attack: ask      # ask | first_hostile — ask is "Attack whom?" outside combat

# Passive HP and mana. Each block has an hp pool and a mana pool.
# A pool is off when enabled is false, or when percent and flat are both 0.
# Intervals use the server clock. The first tick after login is 0 to interval-1 seconds in.
# A very small interval saves the character and pushes one websocket update per regenerating player.
# Per-round mana (1 + wisdom modifier) is separate from in_combat.
regen:
  out_of_combat:
    hp:
      enabled: true         # false = no passive HP while not fighting and not resting
      percent: 2            # percent of max HP per tick
      flat: 0               # flat HP added per tick
      interval_seconds: 10  # seconds between ticks
    mana:
      enabled: true
      percent: 5
      flat: 0
      interval_seconds: 10
  resting:
    hp:
      enabled: true         # false = no HP while resting
      percent: 10
      flat: 0
      interval_seconds: 10
    mana:
      enabled: true
      percent: 15
      flat: 0
      interval_seconds: 10
  in_combat:
    hp:
      enabled: true         # false = no HP on the combat regen tick
      percent: 0.5
      flat: 0
      interval_seconds: 10
    mana:
      enabled: true
      percent: 1
      flat: 0
      interval_seconds: 10
