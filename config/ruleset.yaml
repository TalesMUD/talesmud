# Ruleset profile. Defaults match current play.
# Do not copy keys from config/combat_balance.yaml into this file.
# level_gap, threat, reward_scale, class_balance, difficulty multipliers,
# and named overrides stay in that file. Base XP listed here is multiplied
# by reward_scale afterward.

progression:
  level_cap: 50
  level_up_mode: auto   # auto | trainer
  # xp_required:        # cumulative XP to reach that level; omit = built-in curve
  #   1: 0
  #   2: 40
  # base_xp_by_enemy_level:  # used only when an enemy's xp reward is 0
  #   1: 20

death:
  xp_loss_percent: 10
  gold_loss_flat: 1
  gold_loss_percent: 0
  respawn: bindpoint    # bindpoint | next_reset
  respawn_hp_percent: 50
  damage_armor: true

new_day:
  full_heal: false
  timezone: UTC

resources: {}

combat:
  pacing: auto          # auto | turn_based
  safe_room: stay       # stay | bind | start — used only when disconnect is release
  disconnect: continue  # continue | release — continue leaves the fight running
  bare_attack: ask      # ask | first_hostile — ask is "Attack whom?" outside combat
  # Minimum seconds after a death before a spawner replaces the corpse.
  # An authored respawnDelay still waits when it is longer. 0 disables the floor.
  # Server start still fills InitialCount immediately.
  respawn_min_seconds: 30
  # Same-room aggro for enemies with aggroOnSight. Sight is this room only.
  # enabled false is the kill switch. grace_seconds clamps to 0.5–10.
  # max_level_gap skips a player more than this many levels above the enemy; 0 disables that filter.
  # reaggro_cooldown_seconds is per player+NPC instance after a fight between them ends. 0 allows an immediate new sighting.
  # Leaving during the grace window does not start the cooldown.
  # respawn_grace_seconds holds a fresh respawn that appears on players already in the room. 0 uses grace_seconds.
  # post_combat_grace_seconds holds aggressive NPCs in the fight room after a victory or flee. Leaving ends it. 0 disables it.
  # spawn_aggro_cooldown_seconds stops that spawn from auto-aggroing the same player again, including a replacement. 0 disables it. attack still works.
  aggro_on_sight:
    enabled: true
    grace_seconds: 2.5
    max_level_gap: 5
    reaggro_cooldown_seconds: 15
    respawn_grace_seconds: 8
    post_combat_grace_seconds: 10
    spawn_aggro_cooldown_seconds: 60

# Passive HP and mana. Each block has an hp pool and a mana pool.
# A pool is off when enabled is false, or when percent and flat are both 0.
# Intervals use the server clock. The first tick after login is 0 to interval-1 seconds in.
# A very small interval saves the character and pushes one websocket update per regenerating player.
# Per-round mana (1 + wisdom modifier) is separate from in_combat.
regen:
  out_of_combat:
    hp:
      enabled: true         # false = no passive HP while not fighting and not resting
      percent: 2            # percent of max HP per tick
      flat: 0               # flat HP added per tick
      interval_seconds: 10  # seconds between ticks
    mana:
      enabled: true
      percent: 5
      flat: 0
      interval_seconds: 10
  resting:
    hp:
      enabled: true         # false = no HP while resting
      percent: 10
      flat: 0
      interval_seconds: 10
    mana:
      enabled: true
      percent: 15
      flat: 0
      interval_seconds: 10
  in_combat:
    hp:
      enabled: true         # false = no HP on the combat regen tick
      percent: 0.5
      flat: 0
      interval_seconds: 10
    mana:
      enabled: true
      percent: 1
      flat: 0
      interval_seconds: 10

# Next-step hint for a character who has not finished a quest.
# enabled false builds no hint and sends nothing. Omitted stays on.
guide:
  enabled: true

# Repeatable quests with repeatReset: daily open again at this UTC hour.
# Omitted stays at 4. A value outside 0-23 is rejected.
quests:
  daily_reset_hour_utc: 4

# Equipped item score for the public leaderboard.
# Omitted keys keep the engine defaults. piece = quality * (1 + level) + stat budget.
# cache_seconds 0 recomputes every request. Cap 300.
