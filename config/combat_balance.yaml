# Combat Balance Configuration (C6 — duration pass)
# Multipliers applied to base enemy stats based on difficulty tier
# Formula: final_stat = base_stat * multiplier
#
# Duration targets (player turns, level-appropriate Warrior with attrs spent):
#   Trash (trivial/easy): ~3–6
#   Elites (normal/hard): ~8–15
#   Bosses:               ~15–30
#
# named_overrides replace difficulty multipliers for a specific enemy name
# (exact match on NPC name as authored in content).

difficulty_multipliers:
  trivial:
    hp: 2.5         # Catacomb Rat: 8 * 2.5 = 20 HP  (~4 turns)
    attack: 3.0     # Catacomb Rat: 1 * 3.0 = 3 ATK
    defense: 1.0

  easy:
    hp: 1.9         # Sewer Rat: 12 * 1.9 ≈ 23 HP; Tunnel Mole: 15 * 1.9 ≈ 28
    attack: 1.4     # Sewer Rat: 3 * 1.4 ≈ 4 ATK
    defense: 0.5    # Tunnel Mole: 2 * 0.5 = 1 DEF (less sponge)

  normal:
    hp: 2.7         # Meadow Wolf: 18 * 2.7 ≈ 49; Bandit: 22 * 2.7 ≈ 59
    attack: 1.35    # Meadow Wolf: 4 * 1.35 ≈ 5 ATK
    defense: 1.5    # Meadow Wolf: 1 * 1.5 ≈ 1–2 DEF

  hard:
    hp: 0.9         # Thornback Bear: 80 * 0.9 = 72 HP (~13 turns at L5)
    attack: 1.0     # 11 ATK
    defense: 1.0    # 4 DEF

  boss:
    hp: 1.85        # Burrow Brute: 55 * 1.85 ≈ 102 HP (~22 turns at L4)
    attack: 1.15    # Burrow Brute: 8 * 1.15 ≈ 9 ATK (survivable)
    defense: 1.5    # Burrow Brute: 3 * 1.5 ≈ 4–5 DEF

# Per-enemy overrides (applied instead of the difficulty tier multipliers)
named_overrides:
  "The Hollow Knight":
    hp: 1.0         # 150 HP (~22 turns with skills at L6)
    attack: 0.85    # 13 * 0.85 ≈ 11 ATK — threatening but killable
    defense: 0.9    # 6 * 0.9 ≈ 5 DEF
  "Hollow Knight":
    hp: 1.0
    attack: 0.85
    defense: 0.9

# Level gap (attacker level − defender level), clamped to ±max_levels.
# Gap 0 is neutral: hit, crit, and damage match the formulas without a gap.
# Positive gap: the attacker is higher level. Negative: the defender is higher.
# Basic attacks turn hit_chance into a d20 bonus (0.05 = +1). Natural 1 always
# misses and natural 20 always hits. crit_chance is added to the 5% natural-20
# base. Skills always hit at gap >= 0; a negative hit_chance is a per-hit miss
# chance, and only a positive crit_chance can crit a skill (no base crit).
# Damage multiplier is (1 + gap*damage_dealt) * (1 + gap*damage_taken), clamped.
# Applied after defense, before crit, on basic attacks, skill hits, and DoTs.
# Feel targets: enemy +3 is hard in level-appropriate gear and fair in good gear;
# +5 is a skull fight; −3 or lower feels trivial.
level_gap:
  max_levels: 6
  per_level:
    hit_chance: 0.05
    crit_chance: 0.015
    damage_dealt: 0.06
    damage_taken: 0.04
  min_damage_multiplier: 0.40
  max_damage_multiplier: 1.80

# Con colors from (enemyLevel - playerLevel). Cutoffs ascend.
# <= grey grey, then green, yellow, orange, red; above red is skull.
# Orange, red, and skull warn once before attack (attack! or a second attack engages).
# -3 or lower is grey (trivial). +1 is still yellow. +5 or higher is skull.
threat:
  grey_at_or_below: -3
  green_at_or_below: -1
  yellow_at_or_below: 1
  orange_at_or_below: 2
  red_at_or_below: 4

# Notes:
# - Tuned so strength difference drives duration (trash fast, bosses long but killable).
# - Sims auto-spend distributable attribute points on primary attr (competent player).
# - Content: prefer difficulty "easy" for Sewer Rat / Tunnel Mole (currently "normal"
#   in talesmud-rpg-1); until retagged, named play still uses normal multipliers.
# - Re-import NPCs after changing this file so live DB picks up new finals.
