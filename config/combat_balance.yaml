# Combat Balance Configuration (C6 — duration pass)
# Multipliers applied to base enemy stats based on difficulty tier
# Formula: final_stat = base_stat * multiplier
#
# Duration targets (player turns, level-appropriate Warrior with attrs spent):
#   Trash (trivial/easy): ~3–6
#   Elites (normal/hard): ~8–15
#   Bosses:               ~15–30
#
# named_overrides replace difficulty multipliers for a specific enemy name
# (exact match on NPC name as authored in content).

difficulty_multipliers:
  trivial:
    hp: 2.5         # Catacomb Rat: 8 * 2.5 = 20 HP  (~4 turns)
    attack: 3.0     # Catacomb Rat: 1 * 3.0 = 3 ATK
    defense: 1.0

  easy:
    hp: 1.9         # Sewer Rat: 12 * 1.9 ≈ 23 HP; Tunnel Mole: 15 * 1.9 ≈ 28
    attack: 1.4     # Sewer Rat: 3 * 1.4 ≈ 4 ATK
    defense: 0.5    # Tunnel Mole: 2 * 0.5 = 1 DEF (less sponge)

  normal:
    hp: 2.7         # Meadow Wolf: 18 * 2.7 ≈ 49; Bandit: 22 * 2.7 ≈ 59
    attack: 1.35    # Meadow Wolf: 4 * 1.35 ≈ 5 ATK
    defense: 1.5    # Meadow Wolf: 1 * 1.5 ≈ 1–2 DEF

  hard:
    hp: 0.9         # Thornback Bear: 80 * 0.9 = 72 HP (~13 turns at L5)
    attack: 1.0     # 11 ATK
    defense: 1.0    # 4 DEF

  boss:
    hp: 1.85        # Burrow Brute: 55 * 1.85 ≈ 102 HP (~22 turns at L4)
    attack: 1.15    # Burrow Brute: 8 * 1.15 ≈ 9 ATK (survivable)
    defense: 1.5    # Burrow Brute: 3 * 1.5 ≈ 4–5 DEF

# Normal-tier enemies at or below max_level multiply the tier factors above
# before the integer truncate. A level-2 Alley Thug is authored at 18 HP.
# The normal tier alone makes that 18 * 2.7 = 48. early_normal.hp 0.42 makes
# the live body 18 * 2.7 * 0.42 = 20. Levels above max_level, and every
# other tier (trivial rats, hard elites, bosses, named overrides), stay
# on the table above. This does not touch the level-10 gap matrix, which
# uses CreateScaledEnemy rather than these multipliers.
early_normal:
  max_level: 6
  hp: 0.42
  attack: 1.45
  defense: 0.80

# Extra class factors while THAT combatant is level 1–5. Plate and leather
# subtract 4 from a hit; a cloth robe subtracts 1, so the same starter
# enemy deletes a Rune Hand and barely chips a Fenwatch. These factors
# close that gap for the first five levels only. Level 6 and up, including
# the level-10 gap table, do not use them.
newbie_curve:
  max_player_level: 5
  # A +2 (or worse) attacker hits harder against a level 1–5 player, and
  # only when that attacker is also still in the early band. Same-level and
  # +1 fights do not. A level-9 Marsh Spider does not. Level 6+ players do not.
  # The factor is per class. Leather AC 18 shrugs off a bandit swing, so the
  # one hit that lands has to threaten a second. A cloth robe is already hit
  # often enough that an extra factor would delete the Rune Hand.
  uphill_gap: 2
  uphill_max_attacker_level: 6
  uphill_taken: 2.2
  classes:
    warrior:
      uphill_taken: 2.2
    rogue:
      # 1.5 leaves a Bandit crit at 20 against 21 HP. 1.6 makes that crit 22
      # and the fight falls from about 82% to 50%. There is no integer between.
      uphill_taken: 1.5
    ward:
      uphill_taken: 1.5
    mage:
      damage_dealt: 1.15
      damage_taken: 0.32
      uphill_taken: 1.0
    rigger:
      damage_dealt: 1.30
      damage_taken: 0.95
      uphill_taken: 1.0

# Per-enemy overrides (applied instead of the difficulty tier multipliers)
named_overrides:
  "The Hollow Knight":
    hp: 1.0         # 150 HP (~22 turns with skills at L6)
    attack: 0.85    # 13 * 0.85 ≈ 11 ATK — threatening but killable
    defense: 0.9    # 6 * 0.9 ≈ 5 DEF
  "Hollow Knight":
    hp: 1.0
    attack: 0.85
    defense: 0.9

# Level gap (attacker level − defender level), clamped to ±max_levels.
# Gap 0 is neutral: hit, crit, and damage match the formulas without a gap.
# Positive gap: the attacker is higher level. Negative: the defender is higher.
# Basic attacks turn hit_chance into a d20 bonus (0.05 = +1). Natural 1 always
# misses and natural 20 always hits. crit_chance is added to the 5% natural-20
# base. Skills always hit at gap >= 0; a negative hit_chance is a per-hit miss
# chance, and only a positive crit_chance can crit a skill (no base crit).
# Damage multiplier is (1 + gap*damage_dealt) * (1 + gap*damage_taken), clamped.
# Applied after defense, before crit, on basic attacks, skill hits, and DoTs.
# Feel targets: enemy +3 is hard in level-appropriate gear and fair in good gear;
# +5 is a skull fight; −3 or lower feels trivial.
level_gap:
  max_levels: 6
  per_level:
    # Gentler than the first pass so good gear can close about three levels,
    # while +5 stays a skull fight. Gap 0 is still an exact no-op.
    hit_chance: 0.035
    crit_chance: 0.01
    damage_dealt: 0.035
    damage_taken: 0.02
  min_damage_multiplier: 0.40
  max_damage_multiplier: 1.80

# Con colors from (enemyLevel - playerLevel). Cutoffs ascend.
# <= grey grey, then green, yellow, orange, red; above red is skull.
# Orange, red, and skull warn once before attack (attack! or a second attack engages).
# -3 or lower is grey (trivial). +1 is still yellow. +5 or higher is skull.
threat:
  grey_at_or_below: -3
  green_at_or_below: -1
  yellow_at_or_below: 1
  orange_at_or_below: 2
  red_at_or_below: 4

# XP and gold multipliers by the same threat tier (enemyLevel - referenceLevel).
# referenceLevel is the highest level among characters who receive the victory split.
# grey is a trickle (about 15%). yellow is the full base. skull is double.
# first_kill_bonus is added to each character's own share of a boss they have
# not received the bonus for yet (persisted on the character).
reward_scale:
  grey: 0.15
  green: 0.60
  yellow: 1.0
  orange: 1.25
  red: 1.50
  skull: 2.0
  first_kill_bonus: 0.50

# Per-class damage after defense and level_gap, before crit.
# REPLACES the previous rows. Do not stack the old rogue 2.35 / mage 0.46 on top.
# damage_dealt multiplies each swing. damage_taken multiplies hits received.
# behind_dealt is capped at 1.15 for every class. swings is basic attacks per action.
# Fallback rows used only when the class catalog has no row for that id.
# wizard reads as mage. ranger and hunter read as rogue.
# hitch is a stored id that reads as ward.
# HP scales are create-time only and come from the catalog when a pack is loaded.
class_balance:
  warrior:
    damage_dealt: 1.00
    damage_taken: 0.90
    behind_dealt: 1.15
    swings: 1
  rogue:
    damage_dealt: 0.55
    damage_taken: 1.15
    behind_dealt: 1.15
    swings: 2
  mage:
    damage_dealt: 1.40
    damage_taken: 1.25
    behind_dealt: 1.15
    swings: 1
  ward:
    damage_dealt: 0.95
    damage_taken: 1.00
    behind_dealt: 1.15
    swings: 1
  rigger:
    damage_dealt: 0.85
    damage_taken: 1.00
    behind_dealt: 1.15
    swings: 1

# Boss wind-up and late-fight spike. telegraph_turns is how many of this
# enemy's actions are a warning before the hit. telegraph_ms is the pulse
# length on the battle screen. Enrage is bosses only: after the round count
# or at/under the HP fraction, damage is multiplied and further wind-ups stop.
# hard is the elite tier. Trash does not wind up.
boss_mechanics:
  telegraph_turns: 1
  telegraph_ms: 1400
  telegraph_label: "Crushing Blow"
  telegraph_tiers: ["boss", "hard"]
  enrage_after_rounds: 16
  enrage_below_hp: 0.30
  enrage_damage: 1.20
  enrage_tiers: ["boss"]
  enrage_skips_telegraph: true
  # Bosses advance permanently through descending HP bands, including on skills/DoT.
  # Omit phases to disable. Optional damage_dealt / enrage_damage default to inherited.
  # A6 enrage still triggers at round 16 or 30% HP; it skips all phase wind-ups.
  phase_tiers: ["boss"]
  phases:
    - label: "Opening"
      below_hp: 1.0
    - label: "Escalation"
      below_hp: 0.66
      telegraph_label: "Shattering Blow"
    - label: "Last Stand"
      below_hp: 0.33
      telegraph_label: "Desperate Crush"

# Notes:
# - Tuned so strength difference drives duration (trash fast, bosses long but killable).
# - Sims auto-spend distributable attribute points on primary attr (competent player).
# - Content: prefer difficulty "easy" for Sewer Rat / Tunnel Mole (currently "normal"
#   in talesmud-rpg-1); until retagged, named play still uses normal multipliers.
# - Re-import NPCs after changing this file so live DB picks up new finals.
